# 야간 카탈로그 동기화. 저장소 Settings에서 Pages(Source: GitHub Actions)와 Actions 시크릿 FSK_API_KEY를 설정해야 동작한다.
# 식품안전나라는 낮(06~19시) 호출을 제한하고 당일 변경분은 19시 이후에 열리므로 새벽 3시(KST)에 돈다.
# 어느 단계든 실패하면 배포 단계까지 가지 않아 마지막으로 성공한 카탈로그가 그대로 남는다.
name: sync-catalog
on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch:
    inputs:
      full:
        description: "전체 동기화 강제"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sync-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 지난 원문을 이어받아 증분으로 합친다. 캐시가 없으면 전체 동기화가 된다.
      - uses: actions/cache@v4
        with:
          path: data/i0030-raw.json
          key: i0030-raw-${{ github.run_id }}
          restore-keys: i0030-raw-
      - run: npm test
      - run: test -n "$FSK_API_KEY" && npm run sync # 키가 없으면 샘플 데이터로 덮어쓰지 않게 멈춘다
        env:
          FSK_API_KEY: ${{ secrets.FSK_API_KEY }}
          FSK_FULL: ${{ inputs.full && '1' || '' }}
      - run: npm run build:catalog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/catalog
      - uses: actions/deploy-pages@v4
